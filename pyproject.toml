[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qnetlab"
version = "0.1.0"
description = "Framework IaC para laboratórios de redes QKD/IPsec pós-quântico no GNS3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "requests>=2.31",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
schema = ["jsonschema>=4.0"]
dev = ["pytest>=7", "matplotlib>=3.7", "jsonschema>=4.0"]

[project.scripts]
qnetlab = "qnetlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
