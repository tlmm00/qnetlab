# Não edite à mão: altere a topologia e rode `qnetlab images`.
listen: "0.0.0.0:8443"
local_kme_id: "kme-sim-5"
use_mTLS: true

tls:
  server_cert_path: "/certs/kme-sim-5.crt.pem"
  server_key_path: "/certs/kme-sim-5.key.pem"
  client_ca_cert_path: "/certs/ca.crt.pem"

storage:
  type: "sqlite"
  params:
    path: "/opt/kme/data/kme-sim-5.db"

peer_sync:
