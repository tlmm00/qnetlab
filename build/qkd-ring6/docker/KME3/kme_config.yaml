# Gerado por QNetLab para kme-sim-3 — esquema do KME de KMS-sim (src/main.py).
# Não edite à mão: altere a topologia e rode `qnetlab images`.
listen: "0.0.0.0:8443"
local_kme_id: "kme-sim-3"
use_mTLS: true

tls:
  server_cert_path: "/certs/kme-sim-3.crt.pem"
  server_key_path: "/certs/kme-sim-3.key.pem"
  client_ca_cert_path: "/certs/ca.crt.pem"

storage:
  type: "sqlite"
  params:
    path: "/opt/kme/data/kme-sim-3.db"

peer_sync:
  type: "http_mtls"
  sync_interval_s: 5
  generation_delay_s: 0.5
  sync_threshold: 100
  request_timeout_ms: 5000
  max_retries: 3
  peers:
    kme-sim-2:
      base_url: "https://172.16.100.5:8443"
      seed: "c3b1f4d0323a1874845433884f678af6031107cfeca61c897c463bc5b566b114"
      client_cert_path: "/certs/kme-sim-3.crt.pem"
      client_key_path: "/certs/kme-sim-3.key.pem"
      server_ca_cert_path: "/certs/ca.crt.pem"
    kme-sim-4:
      base_url: "https://172.16.100.10:8443"
      seed: "722491f04db75dbdb3e4408a4da60d130e200eb6e087b118e556e4ddfa86fe33"
      client_cert_path: "/certs/kme-sim-3.crt.pem"
      client_key_path: "/certs/kme-sim-3.key.pem"
      server_ca_cert_path: "/certs/ca.crt.pem"

