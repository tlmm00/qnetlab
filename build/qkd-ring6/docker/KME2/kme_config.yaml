# Gerado por QNetLab para kme-sim-2 — esquema do KME de KMS-sim (src/main.py).
# Não edite à mão: altere a topologia e rode `qnetlab images`.
listen: "0.0.0.0:8443"
local_kme_id: "kme-sim-2"
use_mTLS: true

tls:
  server_cert_path: "/certs/kme-sim-2.crt.pem"
  server_key_path: "/certs/kme-sim-2.key.pem"
  client_ca_cert_path: "/certs/ca.crt.pem"

storage:
  type: "sqlite"
  params:
    path: "/opt/kme/data/kme-sim-2.db"

peer_sync:
  type: "http_mtls"
  sync_interval_s: 5
  generation_delay_s: 0.5
  sync_threshold: 100
  request_timeout_ms: 5000
  max_retries: 3
  peers:
    kme-sim-1:
      base_url: "https://172.16.100.1:8443"
      seed: "a66e74c64a2bf404a9ce364ffb6164f23d2048bad2ec3232564b9bb5328fb3d4"
      client_cert_path: "/certs/kme-sim-2.crt.pem"
      client_key_path: "/certs/kme-sim-2.key.pem"
      server_ca_cert_path: "/certs/ca.crt.pem"
    kme-sim-3:
      base_url: "https://172.16.100.6:8443"
      seed: "c3b1f4d0323a1874845433884f678af6031107cfeca61c897c463bc5b566b114"
      client_cert_path: "/certs/kme-sim-2.crt.pem"
      client_key_path: "/certs/kme-sim-2.key.pem"
      server_ca_cert_path: "/certs/ca.crt.pem"

