# Gerado por QNetLab para kme-sim-6 — esquema do KME de KMS-sim (src/main.py).
# Não edite à mão: altere a topologia e rode `qnetlab images`.
listen: "0.0.0.0:8443"
local_kme_id: "kme-sim-6"
use_mTLS: true

tls:
  server_cert_path: "/certs/kme-sim-6.crt.pem"
  server_key_path: "/certs/kme-sim-6.key.pem"
  client_ca_cert_path: "/certs/ca.crt.pem"

storage:
  type: "sqlite"
  params:
    path: "/opt/kme/data/kme-sim-6.db"

peer_sync:
  type: "http_mtls"
  sync_interval_s: 5
  generation_delay_s: 0.5
  sync_threshold: 100
  request_timeout_ms: 5000
  max_retries: 3
  peers:
    kme-sim-1:
      base_url: "https://kme-sim-1:8443"
      seed: "d24112d9c32557d137814228e284ca498b0cbd443e6fe1e6fc4bea909037af01"
      client_cert_path: "/certs/kme-sim-6.crt.pem"
      client_key_path: "/certs/kme-sim-6.key.pem"
      server_ca_cert_path: "/certs/ca.crt.pem"
    kme-sim-5:
      base_url: "https://kme-sim-5:8443"
      seed: "2506412a03e5408a1015419cdbefcf0f9246c8c2730eb055650c06d6fd67bf46"
      client_cert_path: "/certs/kme-sim-6.crt.pem"
      client_key_path: "/certs/kme-sim-6.key.pem"
      server_ca_cert_path: "/certs/ca.crt.pem"

# SAEs conectados a cada KME (os de KMEs remotos viram rotas de chave via o enlace KMA correspondente).
kme_topology:
  kme-sim-1:
    connected_saes:
      - "sae-chr11"
      - "sae-chr12"
  kme-sim-2:
    connected_saes:
      - "sae-chr21"
      - "sae-chr22"
  kme-sim-3:
