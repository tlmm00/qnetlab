# Gerado por QNetLab — teste rápido SEM GNS3: só os KMEs, numa rede plana (sem roteadores).
# Contém as seeds dos KMEs: não versionar.
name: qkd-ring6
services:
  kme-sim-1:
    image: qnetlab/qkd-ring6-kme1:latest
    container_name: qkd-ring6-kme-sim-1
    hostname: kme-sim-1
    environment:
      KME_CONFIG: "/etc/qnetlab/kme_config.yaml"
      KME_ID: "kme-sim-1"
      NODE_NAME: "KME1"
      ROLE: "kme"
      SKIP_NET: "1"
    volumes:
      - ./kme_config.kme-sim-1.yaml:/etc/qnetlab/kme_config.yaml:ro
    networks: [lab]
  kme-sim-2:
