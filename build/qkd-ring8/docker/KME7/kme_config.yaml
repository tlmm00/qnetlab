# Gerado por QNetLab para kme-sim-7 — esquema do KME de KMS-sim (src/main.py).
# Não edite à mão: altere a topologia e rode `qnetlab images`.
listen: "0.0.0.0:8443"
local_kme_id: "kme-sim-7"
use_mTLS: true

tls:
  server_cert_path: "/certs/kme-sim-7.crt.pem"
  server_key_path: "/certs/kme-sim-7.key.pem"
  client_ca_cert_path: "/certs/ca.crt.pem"

storage:
  type: "sqlite"
  params:
    path: "/opt/kme/data/kme-sim-7.db"

peer_sync:
